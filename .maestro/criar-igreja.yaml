# Criar igreja: igreja e cultos → dados do admin → código no e-mail
# (mock: sempre 123456) → igreja criada com o código para a equipe.
appId: com.servosapp.app
name: Criar igreja
tags:
  - cadastro
---
- runFlow: subflows/abrir-app-limpo.yaml
- tapOn: "Minha igreja ainda não usa o Servos"
- extendedWaitUntil:
    visible: "Sua igreja no Servos"
    timeout: 10000
- tapOn:
    text: "Nome da igreja"
    below: "Nome da igreja"
- inputText: "Igreja Teste E2E"
- pressKey: Enter
- scrollUntilVisible:
    element: "Continuar"
    direction: DOWN
- tapOn: "Continuar"
- extendedWaitUntil:
    visible: "Seus dados"
    timeout: 10000
# Nome → Enter → e-mail. O celular é opcional e o teclado numérico não tem
# Enter, então rola até a senha e toca nela; o Enter da senha envia o código.
- tapOn:
    text: "Nome completo"
    below: "Nome completo"
- inputText: "Ana Teste"
- pressKey: Enter
- inputText: "ana.e2e@exemplo.com"
- runFlow: subflows/rolar-formulario.yaml
- tapOn:
    text: "Senha"
    below: "Senha"
- inputText: "segredo123"
- pressKey: Enter
- runFlow: subflows/dispensar-salvar-senha.yaml
- extendedWaitUntil:
    visible: "Digite o código"
    timeout: 10000
# O campo do código ganha o foco sozinho; o toque garante o foco caso o
# alerta de senha tenha tirado.
- tapOn:
    text: "Código de 6 dígitos"
    optional: true
- inputText: "123456"
- extendedWaitUntil:
    visible: "Igreja criada!"
    timeout: 15000
- assertVisible: "Compartilhar código"
- tapOn: "Começar"
- extendedWaitUntil:
    visible: "Olá, Ana!"
    timeout: 20000
