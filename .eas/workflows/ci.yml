# Validação de todo push e PR para main: lint, typecheck e testes.
# Não gera build nem update.
name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  image: sdk-57
  tools:
    node: 22.23.2 # mesma versão do eas.json

jobs:
  validar:
    name: Lint, typecheck e testes
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      # stdin fechado (</dev/null): sem isso o Jest fica parado esperando entrada.
      - name: Instalar dependências
        run: npm ci </dev/null
      - name: Lint
        run: npx expo lint </dev/null
      - name: Typecheck
        run: npx tsc --noEmit </dev/null
      - name: Testes
        run: npx jest --ci </dev/null
